name: Poko
description: >-
  Poko was a Singapore-based fintech that built a fiat-to-crypto on-ramp
  aggregator for Web3 businesses — wallets, wallet-as-a-service providers,
  marketplaces, dApps, and games. Its product connected 100+ local and
  international payment methods with local KYC and smart routing so global
  users could buy crypto or pay for NFTs with familiar local payment rails,
  exposed to developers via SDKs (including a React Native SDK) and a Dashboard
  API. Backed by 500 Global, ADB Ventures, Amasia, CE Innovation Capital, and
  CreditEase, Poko was acquired by Web3Auth (Torus Labs) in October 2023 and its
  on-ramp aggregator continues under the Web3Auth brand. The original Poko
  developer surface is no longer operational: the pokoapp.xyz domain is now
  parked/for sale and the docs.pokoapp.xyz documentation host has been
  deprovisioned.
